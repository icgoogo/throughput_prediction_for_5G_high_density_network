[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdd-modular-pipeline"
version = "0.1.0"
description = "Modularized 5G HDD throughput prediction pipeline from notebook"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
